# https://man.openbsd.org/tmux.1

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1

# open new windows in the current pane's directory, not the session's start dir
bind c new-window -c "#{pane_current_path}"

# pass modified keys (e.g. Shift+Enter) through to apps that request them, like Claude Code
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
